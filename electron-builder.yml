# Ne pas changer appId sans précaution : le GUID de désinstallation NSIS en dérive. Le modifier
# installerait une seconde application au lieu de mettre à jour les versions déjà déployées.
appId: com.electron.app
productName: lads
directories:
  buildResources: build
# Liste blanche : seul ce qui est utile à l'exécution part dans l'installeur.
# package.json et les dépendances de production sont ajoutés automatiquement.
files:
  - out/**
  - resources/**
asarUnpack:
  - resources/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: lads
  # La signature est activée par la CI quand les secrets existent : voir docs/RELEASE.md.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: isoka33@gmail.com
  category: Utility
  artifactName: ${name}-${version}.${ext}
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  - provider: github
    owner: Harkhenon
    repo: LADS
