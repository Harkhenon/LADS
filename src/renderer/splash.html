<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:"
    />
    <title>LADS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1a30;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .loader {
        position: relative;
        width: 36px;
        height: 36px;
      }
      .loader::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(120, 160, 240, 0.18);
      }
      .loader::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: rgba(148, 182, 255, 0.9);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        color: #94b6ff;
        font-size: 15px;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <img src="./logo.webp" alt="LADS" />
    <div class="loader"></div>
    <div class="title">Les Animations De Sybille ♥️</div>
  </body>
</html>
