<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="badge"><rect x="20" y="20" width="200" height="200" rx="48"/></clipPath>

    <!-- Dégradés de fond -->
    <linearGradient id="gIndigo" x1="20" y1="20" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C80D6"/>
      <stop offset="1" stop-color="#4C4FA0"/>
    </linearGradient>
    <linearGradient id="gCorail" x1="20" y1="160" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#E5564E"/>
    </linearGradient>

    <!-- Ombre douce portée sous les glyphes -->
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
      <feOffset dx="0" dy="2.5" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Léger voile sombre en bas du badge pour la profondeur -->
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- Fond bicolore en dégradé, coupé en diagonale -->
  <g clip-path="url(#badge)">
    <rect x="20" y="20" width="200" height="200" fill="url(#gIndigo)"/>
    <polygon points="20,178 220,72 220,220 20,220" fill="url(#gCorail)"/>
    <rect x="20" y="20" width="200" height="200" fill="url(#voile)"/>
  </g>

  <!-- Petit cœur discret (haut-droite, sur l'indigo) -->
  <path d="M12,21.35l-1.45-1.32C5.4,15.36,2,12.28,2,8.5C2,5.42,4.42,3,7.5,3c1.74,0,3.41,0.81,4.5,2.09C13.09,3.81,14.76,3,16.5,3C19.58,3,22,5.42,22,8.5c0,3.78-3.4,6.86-8.55,11.54L12,21.35z" fill="#FFFFFF" opacity="0.1" transform="translate(90,98) scale(2.5)"/>

  <!-- Play : média / playlist (sur l'indigo) -->
  <polygon points="58,42 58,106 118,74" fill="#FFFFFF" filter="url(#ombre)"/>

  <!-- Téléchargement : tige + pointe + réceptacle (sur le corail) -->
  <rect x="152" y="148" width="9" height="30" fill="#FFFFFF" filter="url(#ombre)"/>
  <polygon points="141,172 172,172 156,191" fill="#FFFFFF" filter="url(#ombre)"/>
  <rect x="134" y="198" width="44" height="9" rx="4.5" fill="#FFFFFF" filter="url(#ombre)"/>
</svg>