<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="gIndigo4" x1="40" y1="40" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C80D6"/>
      <stop offset="1" stop-color="#4C4FA0"/>
    </linearGradient>
    <linearGradient id="gCorail4" x1="40" y1="150" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#E5564E"/>
    </linearGradient>
    <linearGradient id="gFusion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C80D6"/>
      <stop offset="1" stop-color="#FF8A7A"/>
    </linearGradient>
  </defs>

  <!-- Play indigo plein, équilibré avec la flèche -->
  <path d="M34 46 L34 134 L106 90 Z" fill="url(#gIndigo4)"/>

  <!-- Flèche de téléchargement en un seul trait fluide (tige + pointe), corail -->
  <path d="M170 40 L170 130 M138 104 L170 136 L202 104"
        fill="none" stroke="url(#gCorail4)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Réceptacle : accent fusion indigo -> corail pour lier les deux mondes -->
  <path d="M108 196 L232 196" stroke="url(#gFusion)" stroke-width="18" stroke-linecap="round" fill="none"/>
</svg>
