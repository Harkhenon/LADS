<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="indigoS" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C80D6"/>
      <stop offset="1" stop-color="#4C4FA0"/>
    </linearGradient>
    <linearGradient id="corailS" x1="120" y1="120" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#E5564E"/>
    </linearGradient>
  </defs>

  <!-- Écran vidéo/YouTube : cadre arrondi indigo + triangle play blanc -->
  <rect x="20" y="44" width="160" height="120" rx="20" fill="url(#indigoS)"/>
  <path d="M76 82 L124 104 L76 126 Z" fill="#FFFFFF"/>

  <!-- Barre de progression/téléchargement : le flux sort de l'écran vers le bas, corail -->
  <path d="M56 196 L56 216" stroke="url(#corailS)" stroke-width="12" stroke-linecap="round"/>
  <path d="M100 188 L100 216" stroke="url(#corailS)" stroke-width="12" stroke-linecap="round"/>
  <path d="M144 180 L144 216" stroke="url(#corailS)" stroke-width="12" stroke-linecap="round"/>

  <!-- Note de musique : le résultat est une chanson -->
  <g stroke="url(#corailS)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M188 84 L188 140"/>
  </g>
  <ellipse cx="176" cy="146" rx="18" ry="14" fill="url(#corailS)"/>
</svg>
