<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="indigoM" x1="30" y1="30" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C80D6"/>
      <stop offset="1" stop-color="#4C4FA0"/>
    </linearGradient>
    <linearGradient id="corailM" x1="130" y1="130" x2="210" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A7A"/>
      <stop offset="1" stop-color="#E5564E"/>
    </linearGradient>
  </defs>

  <!-- Micro à capsule : sphère + tige inclinée, esprit karaoké -->
  <g transform="rotate(45 120 120)">
    <rect x="106" y="96" width="28" height="84" rx="14" fill="url(#indigoM)"/>
    <path d="M70 56 A50 50 0 0 1 170 56 L170 78 L70 78 Z" fill="url(#indigoM)"/>
    <path d="M100 78 L140 78 L134 96 L106 96 Z" fill="url(#indigoM)"/>
    <path d="M120 96 L120 116 M96 104 L110 112 M144 104 L130 112 M84 122 L104 128 M156 122 L136 128"
          stroke="url(#indigoM)" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Réceptacle de téléchargement : le micro "atterrit" sur une plateforme -->
  <path d="M70 210 L170 210" stroke="url(#corailM)" stroke-width="16" stroke-linecap="round" fill="none"/>
</svg>
