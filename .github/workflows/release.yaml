name: Build Release Draft

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          EXPECTED="v$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME différent de la version de package.json ($EXPECTED)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: npm run check

      - name: Build and package
        run: |
          npm run build
          npm run package

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: dist/*

  # Un brouillon seulement : la release devient publique une fois signée sur le PC du mainteneur
  # (scripts/sign-release.mjs). La CI n'a aucun accès à la clé : un compte GitHub compromis ne peut
  # donc pas déployer de code sur les postes.
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Generate checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes release/*
