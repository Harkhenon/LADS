name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-cmd: npx electron-builder --win --publish never
          - os: ubuntu-latest
            build-cmd: npx electron-builder --linux --publish never

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build installer
        run: ${{ matrix.build-cmd }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes || true
          fi
          ARTIFACTS=$(find dist -maxdepth 1 -type f ! -name 'builder-debug.yml')
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" $ARTIFACTS --clobber; then
              exit 0
            fi
            sleep 15
          done
          exit 1
