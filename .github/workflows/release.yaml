name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/preferred-node-version-action@v1
        with:
          node-version: 20 # Mettez votre version de Node

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to GitHub Releases
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
