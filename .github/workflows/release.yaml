name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-cmd: npx electron-builder --win --publish never
          - os: ubuntu-latest
            build-cmd: npx electron-builder --linux --publish never

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build installer
        run: ${{ matrix.build-cmd }}

      # --- Signature SignPath (Windows uniquement) ---
      # Active seulement si les secrets SignPath sont configurés ;
      # sinon la release sort non signée (comportement historique).

      - name: Detect SignPath configuration
        id: signpath-config
        if: runner.os == 'Windows'
        run: |
          if [ -n "$SIGNPATH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      - name: Upload unsigned installer
        if: steps.signpath-config.outputs.enabled == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: dist/*.exe
          include-hidden-files: true

      - name: Submit signing request to SignPath
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace installer with signed version
        if: steps.signpath-config.outputs.enabled == 'true'
        run: |
          find signed -name '*.exe' -exec cp {} dist/ \;
          ls -la dist/*.exe

      # ---

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME"; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes || true
          fi
          ARTIFACTS=$(find dist -maxdepth 1 -type f ! -name 'builder-debug.yml')
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" $ARTIFACTS --clobber; then
              exit 0
            fi
            sleep 15
          done
          exit 1
